<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAT AI English Translation Grading Hub</title>
    <!-- PDF.js library for client-side multi-page exam pdf splitting and rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Support both styles of global registration safely
      const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
      if (pdfjs) {
        window['pdfjs-dist/build/pdf'] = pdfjs;
        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
